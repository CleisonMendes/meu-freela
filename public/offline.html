<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1220" />
    <title>Sem conexão — Meu Freela</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; background: #0b1220; color: #edf3ff; display: grid; place-items: center; padding: 20px; box-sizing: border-box; }
      main { max-width: 430px; padding: 32px; background: #101e33; border: 1px solid #29405d; border-radius: 16px; text-align: center; }
      h1 { margin-top: 0; } p { line-height: 1.5; color: #b9cce2; }
      button { font: inherit; padding: 12px 20px; border: 0; border-radius: 10px; background: #3979e4; color: white; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>Você está sem conexão</h1>
      <p>O Meu Freela precisa de internet para consultar dados atualizados, escalas e pagamentos. Nenhuma informação financeira é exibida offline.</p>
      <button onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
